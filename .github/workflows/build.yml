name: Build kernel deb packages
on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device model for the boot image and rootfs'
        type: choice
        options:
          - mf32t
          - mfx32
          - mfx32-boiler
          - sp970
          - sp970-memory-exp
          - ufi003
          - ufi003-memory-exp
          - uz801
          - uz801-memory-exp
        default: sp970

# cancel superseded runs for the same branch or tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          sudo apt -y update
          sudo apt -y install git lsb-release gcc-aarch64-linux-gnu build-essential bison flex libssl-dev libdw-dev libelf-dev debhelper bc rsync kmod cpio python3 ccache

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-kernel-${{ github.sha }}
          restore-keys: |
            ccache-kernel-

      - name: Build
        env:
          CCACHE_MAXSIZE: 2G
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          make CC="ccache aarch64-linux-gnu-gcc" HOSTCC="ccache gcc" ufi_defconfig
          make CC="ccache aarch64-linux-gnu-gcc" HOSTCC="ccache gcc" deb-pkg -j"$(($(grep -c processor < /proc/cpuinfo)*2))"
          ccache -s

      - name: Prepare artifacts
        run: |
          mkdir artifacts && mv ../linux-image-*.deb ../linux-headers-*.deb artifacts/
          cp arch/arm64/boot/dts/qcom/msm8916-ufi-*.dtb artifacts/
          cp arch/arm64/boot/Image.gz artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: artifacts/*
          compression-level: 0

  bootimg:
    name: Make boot images (${{ inputs.device || 'sp970' }})
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          sudo apt -y update
          sudo apt -y install mkbootimg debootstrap android-sdk-libsparse-utils
          mkdir artifacts

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel
          path: artifacts

      - name: Select device
        env:
          DEVICE: ${{ inputs.device || 'sp970' }}
        run: |
          dtb="artifacts/msm8916-ufi-${DEVICE}.dtb"
          if [ ! -f "$dtb" ]; then
            echo "::error::$dtb not found in the kernel artifact"
            echo "Available devices:"
            ls artifacts/msm8916-ufi-*.dtb | sed -e 's#^artifacts/msm8916-ufi-##' -e 's#\.dtb$##'
            exit 1
          fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd .github/scripts
          chmod +x build_boot_img.sh
          sudo ./build_boot_img.sh "$DEVICE"

      - name: Build rootfs
        run: |
          cd .github/scripts
          chmod +x alpine_rootfs.sh
          sudo ./alpine_rootfs.sh "$DEVICE"
          sudo cp files/rootfs.bin "../../artifacts/alpine-rootfs-${DEVICE}.bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel and boot images
          path: artifacts/*
          compression-level: 0
          
      - name: Generate release tag
        id: version
        run: |
          NAME=$(echo "Debian $(cat ./debian_version)")
          TAG_NAME=$(cat ./debian_version)-$(date +%s)
          git tag $TAG_NAME
          git push origin $TAG_NAME
          echo -e "- Bootloader: lk2nd:version:18.1-next-5a72bd3b-20240920-dirty\n\n$(git log -1 --format=%B)" > release_notes.md
          echo "NAME=$NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.NAME }}
          body_path: release_notes.md
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          files: |
            artifacts/*
